name: Tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # https://docs.github.com/en/actions/reference/runners/github-hosted-runners#standard-github-hosted-runners-for-public-repositories
        platform:
          - ubuntu-latest  # ubuntu-26.04
          - macos-26-intel  # macos-26 (Intel)
          - macos-latest  # macos-26 (Apple Silicon ARM)
          - windows-latest  # windows-2025
        python-version: [3.8, 3.9, '3.10', 3.11, 3.12, 3.13, 3.14, 3.15, pypy-3.8, pypy-3.9, pypy-3.10, pypy-3.11, pypy-3.12, graalpy-25]
        include:
          - platform: ubuntu-22.04
            python-version: 3.7
          - platform: ubuntu-22.04
            python-version: pypy-3.7
          # Ubuntu 26.04 (ubuntu-latest) does not provide CPython 3.8 or 3.9.
          - platform: ubuntu-24.04
            python-version: 3.8
          - platform: ubuntu-24.04
            python-version: 3.9
        exclude:
          - platform: ubuntu-latest
            python-version: 3.8
          - platform: ubuntu-latest
            python-version: 3.9
          # GitHub Actions Windows runners do not support PyPy 3.9 or GraalPy 25.
          # The list of all available versions can be found here:
          # https://raw.githubusercontent.com/actions/python-versions/main/versions-manifest.json
          - platform: windows-latest
            python-version: pypy-3.9
          - platform: windows-latest
            python-version: graalpy-25
          # GraalPy stopped publishing macOS x64 builds after 25.0.1. On macos-26-intel,
          # graalpy-25 resolves to 25.0.1, whose ssl module is unusable by the pip
          # seeded into tox environments.
          - platform: macos-26-intel
            python-version: graalpy-25
    steps:
    - uses: actions/checkout@v6
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
        allow-prereleases: true
    - name: Install dependencies
      run: |
        python -m pip install --upgrade setuptools pip wheel
        # Use the latest published version for myself :)
        python -m pip install --pre tox-gh-actions
    - name: Test with tox
      run: tox
    - name: Upload coverage.xml
      if: ${{ matrix.platform == 'ubuntu-latest' && matrix.python-version == '3.15' }}
      uses: actions/upload-artifact@v7
      with:
        name: tox-gh-actions-coverage
        path: coverage.xml
        if-no-files-found: error
    - name: Upload coverage.xml to codecov
      if: ${{ matrix.platform == 'ubuntu-latest' && matrix.python-version == '3.15' }}
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
